<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">fnc-fogger: Architektur mit mehreren ESP32-C3-Geräten</title>
<desc id="desc">Mehrere ESP32-C3 liefern Messwerte an einen unabhängigen Hintergrundlogger. Dieser speichert pro Gerät eine SQLite-Datenbank. Der Viewer liest die Historie und sendet Bedienbefehle und OTA direkt an das ausgewählte Gerät. Windows startet und überwacht den Logger.</desc>
