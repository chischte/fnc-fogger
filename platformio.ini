[platformio]
default_envs = esp32c3_supermini

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3]
extra_scripts = pre:tools/build_identity.py
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions_esp32s3.csv
board_build.filesystem = littlefs
build_flags =
    -I"$PROJECT_DIR/.."
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<main.cpp> +<firmware/*.cpp> +<esp32/*.cpp>
lib_deps = sensirion/Sensirion I2C SCD4x@^1.1.0
monitor_speed = 115200
upload_protocol = esptool

[env:esp32c3_supermini]
extends = env:esp32s3
board = esp32-c3-devkitm-1
board_build.arduino.memory_type = dio_qspi
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.flash_mode = dio
board_build.partitions = partitions_esp32c3.csv
build_flags =
    -I"$PROJECT_DIR/.."
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
